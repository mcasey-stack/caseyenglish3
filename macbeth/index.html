"who": "Malcolm and Macduff",
"text": "<div class=\"speech verse\"><span class=\"spk\">Malcolm<\/span><span class=\"ln\">But I have none. The king-becoming graces,<span class=\"no\" aria-hidden=\"true\">107<\/span><\/span><span class=\"ln\">As justice, verity, temp’rance, stableness,<\/span><span class=\"ln\">Bounty, perseverance, mercy, lowliness,<\/span><span class=\"ln\">Devotion, patience, courage, fortitude,<span class=\"no\" aria-hidden=\"true\">110<\/span><\/span><span class=\"ln\">I have no relish of them but abound<\/span><span class=\"ln\">In the division of each several crime,<\/span><span class=\"ln\">Acting it many ways. Nay, had I power, I should<\/span><span class=\"ln\">Pour the sweet milk of concord into hell,<\/span><span class=\"ln\">Uproar the universal peace, confound<span class=\"no\" aria-hidden=\"true\">115<\/span><\/span><span class=\"ln\">All unity on earth.<\/span><\/div><div class=\"speech verse\"><span class=\"spk\">Macduff<\/span><span class=\"ln\">O Scotland, Scotland!<\/span><\/div><div class=\"speech verse\"><span class=\"spk\">Malcolm<\/span><span class=\"ln\">If such a one be fit to govern, speak.<\/span><span class=\"ln\">I am as I have spoken.<\/span><\/div><div class=\"speech verse\"><span class=\"spk\">Macduff<\/span><span class=\"ln\">Fit to govern?<span class=\"no\" aria-hidden=\"true\">120<\/span><\/span><span class=\"ln\">No, not to live.<\/span><\/div>",
"plain": "<b>Malcolm:<\/b> But I have none of them. The virtues that suit a king, like justice, truthfulness, self-control, steadiness, generosity, persistence, mercy, humility, devotion, patience, courage, and strength, I have no taste for. Instead I'm full of every kind of crime, and I commit each one in many ways. If I had power, I would pour the sweet milk of peace into hell, throw the world's peace into uproar, and destroy all unity on earth. <b>Macduff:<\/b> Oh Scotland, Scotland! <b>Malcolm:<\/b> If a man like that is fit to rule, say so. I am what I've said. <b>Macduff:<\/b> Fit to rule? No, not fit to live.",
"ctx": "In England, Macduff begs Malcolm to come home and take back the crown. Malcolm, afraid Macduff might be Macbeth's spy, tests him by pretending to be a monster of greed and lust. When Macduff despairs instead of going along, Malcolm knows he is honest and takes it all back.",
"think": "Malcolm lies to find out whether someone is telling the truth: the witches' method, used for a good cause. His list of \"king-becoming graces\" is the first time anyone in the play says what a good king is. Notice the question nobody asks: whether Scotland needs a king at all.",

"who": "Macduff and Malcolm",
"text": "<div class=\"speech verse\"><span class=\"spk\">Macduff<\/span><span class=\"ln\">What’s the disease he means?<span class=\"no\" aria-hidden=\"true\">167<\/span><\/span><\/div><div class=\"speech verse\"><span class=\"spk\">Malcolm<\/span><span class=\"ln\">’Tis called the evil:<\/span><span class=\"ln\">A most miraculous work in this good king,<\/span><span class=\"ln\">Which often since my here-remain in England<span class=\"no\" aria-hidden=\"true\">170<\/span><\/span><span class=\"ln\">I have seen him do. How he solicits heaven<\/span><span class=\"ln\">Himself best knows, but strangely visited people<\/span><span class=\"ln\">All swoll’n and ulcerous, pitiful to the eye,<\/span><span class=\"ln\">The mere despair of surgery, he cures,<\/span><span class=\"ln\">Hanging a golden stamp about their necks,<span class=\"no\" aria-hidden=\"true\">175<\/span><\/span><span class=\"ln\">Put on with holy prayers; and, ’tis spoken,<\/span><span class=\"ln\">To the succeeding royalty he leaves<\/span><span class=\"ln\">The healing benediction. With this strange virtue,<\/span><span class=\"ln\">He hath a heavenly gift of prophecy,<\/span><span class=\"ln\">And sundry blessings hang about his throne<span class=\"no\" aria-hidden=\"true\">180<\/span><\/span><span class=\"ln\">That speak him full of grace.<\/span><\/div>",
"plain": "<b>Macduff:<\/b> What disease does he mean? <b>Malcolm:<\/b> It's called the evil. This good king works a miracle on it; since I came to England I've often seen him do it. How he gets heaven's help, only he knows. But people with strange diseases, swollen and covered in sores, pitiful to look at, beyond any surgeon's help, he cures by hanging a gold coin around their necks while saying holy prayers. People say he will pass this healing blessing on to the kings who come after him. Along with this strange power, he has a heavenly gift of prophecy, and many blessings surround his throne that show he is full of grace.",
"ctx": "A doctor has just said that the King of England, Edward the Confessor, heals the sick by touching them. \"The evil,\" or \"the king's evil,\" was scrofula, a disease that swells the neck. The \"golden stamp\" was a gold coin called an angel.",
"think": "This scene barely moves the plot. So why is it here? Put the two kings side by side: one whose hand heals and one whose hand kills. And notice the line \"To the succeeding royalty he leaves / The healing benediction\": the gift passes down to later kings. Which later king was Shakespeare's patron?",

"lens": [
"History: the royal touch",
"Edward the Confessor is the first English king recorded as healing by touch. James I thought the practice superstitious, but his ministers persuaded him to keep it up. Each patient got a pierced gold angel on a ribbon, hung around the neck. A king who heals by touch is a king whose power comes from God. Shakespeare's audience would have recognized the ceremony as their own king's."
]

"who": "Macduff and Malcolm",
"text": "<div class=\"speech verse\"><span class=\"spk\">Macduff<\/span><span class=\"ln\">He has no children. All my pretty ones?<span class=\"no\" aria-hidden=\"true\">255<\/span><\/span><span class=\"ln\">Did you say “all”? O hell-kite! All?<\/span><span class=\"ln\">What, all my pretty chickens and their dam<\/span><span class=\"ln\">At one fell swoop?<\/span><\/div><div class=\"speech verse\"><span class=\"spk\">Malcolm<\/span><span class=\"ln\">Dispute it like a man.<\/span><\/div><div class=\"speech verse\"><span class=\"spk\">Macduff<\/span><span class=\"ln\">I shall do so,<span class=\"no\" aria-hidden=\"true\">260<\/span><\/span><span class=\"ln\">But I must also feel it as a man.<\/span><span class=\"ln\">I cannot but remember such things were<\/span><span class=\"ln\">That were most precious to me. Did heaven look on<\/span><span class=\"ln\">And would not take their part? Sinful Macduff,<\/span><span class=\"ln\">They were all struck for thee! Naught that I am,<span class=\"no\" aria-hidden=\"true\">265<\/span><\/span><span class=\"ln\">Not for their own demerits, but for mine,<\/span><span class=\"ln\">Fell slaughter on their souls. Heaven rest them now.<\/span><\/div>",
"plain": "<b>Macduff:<\/b> He has no children. All my pretty little ones? Did you say all? Oh, hell-hawk! All? What, all my pretty chicks and their mother, in one cruel swoop? <b>Malcolm:<\/b> Fight it like a man. <b>Macduff:<\/b> I will. But I must also feel it like a man. I can't help remembering that such things existed and were most precious to me. Did heaven look on and not take their side? Sinful Macduff, they were all struck down because of you! Worthless as I am, they were killed not for their own faults but for mine. May heaven give them rest now.",

"text": "<div class=\"speech prose\"><span class=\"spk\">Lady Macbeth<\/span><span class=\"ln\">Out, damned spot, out, I say! One. Two.<span class=\"no\" aria-hidden=\"true\">37<\/span><\/span><span class=\"ln\">Why then, ’tis time to do ’t. Hell is murky. Fie, my<\/span><span class=\"ln\">lord, fie, a soldier and afeard? What need we fear<\/span><span class=\"ln\">who knows it, when none can call our power to<span class=\"no\" aria-hidden=\"true\">40<\/span><\/span><span class=\"ln\">account? Yet who would have thought the old man<\/span><span class=\"ln\">to have had so much blood in him?<\/span><\/div><div class=\"speech prose\"><span class=\"spk\">Doctor<\/span><span class=\"ln\">Do you mark that?<\/span><\/div><div class=\"speech prose\"><span class=\"spk\">Lady Macbeth<\/span><span class=\"ln\">The Thane of Fife had a wife. Where is<\/span><span class=\"ln\">she now? What, will these hands ne’er be clean? No<span class=\"no\" aria-hidden=\"true\">45<\/span><\/span><span class=\"ln\">more o’ that, my lord, no more o’ that. You mar all<\/span><span class=\"ln\">with this starting.<\/span><\/div><div class=\"gap\" aria-label=\"lines skipped\">[...]<\/div><div class=\"speech prose\"><span class=\"spk\">Lady Macbeth<\/span><span class=\"ln\">Here’s the smell of the blood still. All<span class=\"no\" aria-hidden=\"true\">53<\/span><\/span><span class=\"ln\">the perfumes of Arabia will not sweeten this little<\/span><span class=\"ln\">hand. O, O, O!<span class=\"no\" aria-hidden=\"true\">55<\/span><\/span><\/div><div class=\"gap\" aria-label=\"lines skipped\">[...]<\/div><div class=\"speech prose\"><span class=\"spk\">Lady Macbeth<\/span><span class=\"ln\">To bed, to bed. There’s knocking at the<span class=\"no\" aria-hidden=\"true\">69<\/span><\/span><span class=\"ln\">gate. Come, come, come, come. Give me your<span class=\"no\" aria-hidden=\"true\">70<\/span><\/span><span class=\"ln\">hand. What’s done cannot be undone. To bed, to<\/span><span class=\"ln\">bed, to bed.<\/span><\/div>",
"plain": "Out, damned spot! Out, I say! One, two: well then, it's time to do it. Hell is murky. Shame, my lord, shame! A soldier, and afraid? Why should we fear who knows it, when no one can make us answer for our power? But who would have thought the old man had so much blood in him? <b>Doctor:<\/b> Did you hear that? <b>Lady Macbeth:<\/b> The Thane of Fife had a wife. Where is she now? What, will these hands never be clean? No more of that, my lord, no more of that. You ruin everything with this jumping. [...] I can still smell the blood. All the perfumes of Arabia won't make this little hand smell sweet. Oh, oh, oh! [...] To bed, to bed. There's knocking at the gate. Come, come, come, come, give me your hand. What's done can't be undone. To bed, to bed, to bed.",
"ctx": "A doctor and a gentlewoman watch Lady Macbeth walk in her sleep, rubbing her hands as if washing them. She now keeps a light by her bed all night. In her sleep she relives the night Duncan died, then Lady Macduff's murder, then Banquo's. The Thane of Fife is Macduff.",
"think": "In quote 16 she said, \"A little water clears us of this deed.\" In Act 3 she told her husband, \"What's done is done\" (3.2.14). Now: \"What's done cannot be undone.\" Same words, opposite meaning. She tried to bury her conscience, and it came back in her sleep.",

"lens": [
"Sigmund Freud, \"Some Character-Types Met with in Psycho-Analytic Work\" (1916)",
"Freud used Lady Macbeth as an example of people who fall apart at the very moment their wish comes true. He also noticed a strange swap between husband and wife: \"It is he who has the hallucination of the dagger before the crime; but it is she who afterwards falls ill of a mental disorder.\" He suggested the two might be halves of a single person. Do you buy it?"
],

"loc": "Act 5, Scene 2, lines 19–25",
"who": "Angus, to the rebel lords",
"text": "<div class=\"speech verse\"><span class=\"spk\">Angus<\/span><span class=\"ln\">Now does he feel<span class=\"no\" aria-hidden=\"true\">19<\/span><\/span><span class=\"ln\">His secret murders sticking on his hands.<span class=\"no\" aria-hidden=\"true\">20<\/span><\/span><span class=\"ln\">Now minutely revolts upbraid his faith-breach.<\/span><span class=\"ln\">Those he commands move only in command,<\/span><span class=\"ln\">Nothing in love. Now does he feel his title<\/span><span class=\"ln\">Hang loose about him, like a giant’s robe<\/span><span class=\"ln\">Upon a dwarfish thief.<span class=\"no\" aria-hidden=\"true\">25<\/span><\/span><\/div>",
"plain": "Now he feels his secret murders sticking to his hands. Every minute, new revolts blame him for breaking faith. The men he commands move only because they're ordered to, not out of love. Now he feels his title hanging loose on him, like a giant's robe on a dwarf who stole it.",
"ctx": "Scottish lords who have turned against Macbeth march to meet Malcolm's English army near Birnam Wood. \"Upbraid\" means scold. \"Faith-breach\" means broken loyalty.",
"think": "Count the clothing images. In Act 1, Macbeth asked, \"Why do you dress me / In borrowed robes?\" (1.3.114–115). Now the robe is a giant's, and he is the thief. And \"move only in command, / Nothing in love\": soldiers who obey without loyalty. How long can a ruler last on orders alone?",
"see": [
22,
25,
35
],
"lens": [
"Hannah Arendt, <em>On Violence<\/em> (1970)",
"Arendt wrote that \"power corresponds to the human ability not just to act but to act in concert.\" Power is people choosing to act together. Violence is what a ruler falls back on when that's gone: \"Power and violence are opposites; where the one rules absolutely, the other is absent.\" By Arendt's test, Macbeth has plenty of violence and almost no power left."
],

"text": "<div class=\"speech verse\"><span class=\"spk\">Macbeth<\/span><span class=\"ln\">I have lived long enough. My way of life<span class=\"no\" aria-hidden=\"true\">26<\/span><\/span><span class=\"ln\">Is fall’n into the sere, the yellow leaf,<\/span><span class=\"ln\">And that which should accompany old age,<\/span><span class=\"ln\">As honor, love, obedience, troops of friends,<\/span><span class=\"ln\">I must not look to have, but in their stead<span class=\"no\" aria-hidden=\"true\">30<\/span><\/span><span class=\"ln\">Curses, not loud but deep, mouth-honor, breath<\/span><span class=\"ln\">Which the poor heart would fain deny and dare not.<\/span><\/div>",
"plain": "I've lived long enough. My life has withered like a dry yellow leaf in autumn. And the things that should come with old age, like honor, love, obedience, and crowds of friends, I can't hope to have. Instead I get curses, quiet but deep, and honor from people's mouths only: words their poor hearts would like to take back but don't dare.",
"ctx": "Macbeth is in his castle at Dunsinane, waiting for the English army. Many of his men have deserted him. \"Sere\" means dry and withered. \"Fain\" means gladly.",
"think": "\"Mouth-honor\" is loyalty that is only spoken. Macbeth knows his people praise him out of fear. In <em>1984<\/em> the Party won't settle for mouth-honor; it needs Winston to love Big Brother for real (<a class=\"xref\" href=\"../1984/#q37\" target=\"_blank\" rel=\"noopener\">1984, quote 37<\/a>). Which ruler is more dangerous: one who settles for mouth-honor, or one who doesn't?",

"lens": [
"Václav Havel, \"The Power of the Powerless\" (1978)",
"Václav Havel, a Czech playwright jailed by his country's communist government, wrote about a greengrocer who puts a sign in his shop window, among the onions and carrots: \"Workers of the world, unite!\" He doesn't believe it. The sign's real message, Havel says, is \"I am obedient and therefore I have the right to be left in peace.\" That is mouth-honor. Havel argued that a system built on it starts to crack when people stop putting up the signs."
]
},

"loc": "Act 5, Scene 5, lines 18–31",
"who": "Macbeth and Seyton",
"text": "<div class=\"speech verse\"><span class=\"spk\">Macbeth<\/span><span class=\"ln\">Wherefore was that cry?<span class=\"no\" aria-hidden=\"true\">18<\/span><\/span><\/div><div class=\"speech verse\"><span class=\"spk\">Seyton<\/span><span class=\"ln\">The Queen, my lord, is dead.<\/span><\/div><div class=\"speech verse\"><span class=\"spk\">Macbeth<\/span><span class=\"ln\">She should have died hereafter.<span class=\"no\" aria-hidden=\"true\">20<\/span><\/span><span class=\"ln\">There would have been a time for such a word.<\/span><span class=\"ln\">Tomorrow and tomorrow and tomorrow<\/span><span class=\"ln\">Creeps in this petty pace from day to day<\/span><span class=\"ln\">To the last syllable of recorded time,<\/span><span class=\"ln\">And all our yesterdays have lighted fools<span class=\"no\" aria-hidden=\"true\">25<\/span><\/span><span class=\"ln\">The way to dusty death. Out, out, brief candle!<\/span><span class=\"ln\">Life’s but a walking shadow, a poor player<\/span><span class=\"ln\">That struts and frets his hour upon the stage<\/span><span class=\"ln\">And then is heard no more. It is a tale<\/span><span class=\"ln\">Told by an idiot, full of sound and fury,<span class=\"no\" aria-hidden=\"true\">30<\/span><\/span><span class=\"ln\">Signifying nothing.<\/span><\/div>",
"plain": "<b>Macbeth:<\/b> Why was there a scream? <b>Seyton:<\/b> The Queen, my lord, is dead. <b>Macbeth:<\/b> She would have died sometime anyway; there would have been a time for that news. Tomorrow and tomorrow and tomorrow creeps along at this slow pace, day after day, to the last syllable of recorded time. And all our yesterdays have lit the way for fools to dusty death. Go out, go out, short candle! Life is only a walking shadow, a bad actor who struts and frets through his hour on the stage and then is never heard from again. It is a story told by an idiot, full of noise and rage, meaning nothing.",
"ctx": "The English army is closing in. A cry of women has come from inside the castle. Seyton is Macbeth's servant. \"Hereafter\" means at some later time.",
"think": "His wife has died, and he answers that nothing means anything. Is this grief, or the lack of it? Notice the theater words: \"player,\" \"struts and frets,\" \"stage,\" \"tale.\" Macbeth calls life a bad play while standing in one. Does the play agree with him?",

"lens": [
"William Faulkner, <em>The Sound and the Fury<\/em> (1929)",
"Faulkner took his novel's title from this speech. Its first section is narrated by Benjy Compson, a man with an intellectual disability who cannot speak. Faulkner turns Macbeth's line around: the story told by the person everyone dismisses turns out to be full of meaning."
]

"who": "Macbeth and Macduff",
"text": "<div class=\"speech verse\"><span class=\"spk\">Macbeth<\/span><span class=\"ln\">Let fall thy blade on vulnerable crests;<span class=\"no\" aria-hidden=\"true\">14<\/span><\/span><span class=\"ln\">I bear a charmèd life, which must not yield<span class=\"no\" aria-hidden=\"true\">15<\/span><\/span><span class=\"ln\">To one of woman born.<\/span><\/div><div class=\"speech verse\"><span class=\"spk\">Macduff<\/span><span class=\"ln\">Despair thy charm,<\/span><span class=\"ln\">And let the angel whom thou still hast served<\/span><span class=\"ln\">Tell thee Macduff was from his mother’s womb<\/span><span class=\"ln\">Untimely ripped.<span class=\"no\" aria-hidden=\"true\">20<\/span><\/span><\/div><div class=\"speech verse\"><span class=\"spk\">Macbeth<\/span><span class=\"ln\">Accursèd be that tongue that tells me so,<\/span><span class=\"ln\">For it hath cowed my better part of man!<\/span><span class=\"ln\">And be these juggling fiends no more believed<\/span><span class=\"ln\">That palter with us in a double sense,<\/span><span class=\"ln\">That keep the word of promise to our ear<span class=\"no\" aria-hidden=\"true\">25<\/span><\/span><span class=\"ln\">And break it to our hope.<\/span><\/div>",
"plain": "<b>Macbeth:<\/b> Swing your sword at helmets you can hurt. My life is protected by a charm: it can't give in to anyone born of a woman. <b>Macduff:<\/b> Give up on your charm. Let the evil angel you've always served tell you that Macduff was cut from his mother's womb before his time. <b>Macbeth:<\/b> Cursed be the tongue that tells me this, because it has scared the manly part of me! Let no one believe these cheating devils anymore, who trick us with double meanings, who keep the words of their promise to our ears and break it to our hopes. I won't fight you.",
"ctx": "Birnam Wood has already come to Dunsinane: Malcolm's soldiers cut branches to hide their numbers as they marched (5.4). Macbeth has begun \"to doubt th' equivocation of the fiend / That lies like truth\" (5.5.48–50). \"Untimely ripped\" means Macduff was cut from his mother's womb instead of being born the usual way, so in the prophecy's terms he was not \"of woman born.\" \"Palter\" means play tricks.",
"think": "\"Keep the word of promise to our ear / And break it to our hope.\" That is equivocation, the Porter's joke from quote 17, and the con Banquo described in quote 4. The witches never lied. Every word came true. Did they trick Macbeth, or did he trick himself?",

17,
27
],
"lens": [
"Paul Grice, \"Logic and Conversation\" (1975)",
"The philosopher Paul Grice described the unspoken rules people follow in conversation. One is \"Try to make your contribution one that is true.\" Another is \"Avoid ambiguity.\" The witches keep the first rule perfectly and break the second on purpose. Grice's point is that listeners assume speakers follow both. Macbeth trusted that assumption, and the witches used it."
],

"who": "Macduff, then Malcolm",
"text": "<div class=\"speech verse\"><span class=\"spk\">Macduff<\/span><span class=\"ln\">Hail, King! for so thou art. Behold where stands<span class=\"no\" aria-hidden=\"true\">65<\/span><\/span><span class=\"ln\">Th’ usurper’s cursèd head. The time is free.<\/span><span class=\"ln\">I see thee compassed with thy kingdom’s pearl,<\/span><span class=\"ln\">That speak my salutation in their minds,<\/span><span class=\"ln\">Whose voices I desire aloud with mine.<\/span><span class=\"ln\">Hail, King of Scotland!<span class=\"no\" aria-hidden=\"true\">70<\/span><\/span><\/div><div class=\"speech verse\"><span class=\"spk\">All<\/span><span class=\"ln\">Hail, King of Scotland!<\/span><\/div><div class=\"gap\" aria-label=\"lines skipped\">[...]<\/div><div class=\"speech verse\"><span class=\"spk\">Malcolm<\/span><span class=\"ln\">As calling home our exiled friends abroad<span class=\"no\" aria-hidden=\"true\">79<\/span><\/span><span class=\"ln\">That fled the snares of watchful tyranny,<span class=\"no\" aria-hidden=\"true\">80<\/span><\/span><span class=\"ln\">Producing forth the cruel ministers<\/span><span class=\"ln\">Of this dead butcher and his fiend-like queen<\/span><span class=\"ln\">(Who, as ’tis thought, by self and violent hands,<\/span><span class=\"ln\">Took off her life)<\/span><\/div>",
"plain": "<b>Macduff:<\/b> Hail, King, for that's what you are. Look, here is the usurper's cursed head. The time is free. I see you surrounded by the finest men of your kingdom, who are saying my greeting in their minds. I want their voices to join mine out loud: Hail, King of Scotland! <b>All:<\/b> Hail, King of Scotland! [...] <b>Malcolm:<\/b> ...such as calling home our friends who were exiled abroad, who escaped the traps of watchful tyranny, and bringing to justice the cruel agents of this dead butcher and his devilish queen (who, it's thought, took her own life with violent hands)...",
"ctx": "Macduff enters carrying Macbeth's head. Malcolm, Duncan's elder son, will be crowned at Scone, where Scottish kings were crowned. A usurper is someone who takes a throne without the right to it.",
"think": "The play began with a traitor's head on the castle walls (quote 2) and three voices hailing Macbeth as king-to-be (quote 3). It ends with a traitor's head and a crowd hailing a new king. Has anything changed besides the name? And notice how Malcolm sums up the story: \"this dead butcher and his fiend-like queen.\" Is that all they were?",

"lens": [
"History: the real Macbeth",
"The real Macbeth ruled Scotland from 1040 to 1057. He killed King Duncan I near Elgin in 1040, most likely in battle, not in bed, and Duncan was probably in his late thirties, not the old man of the play. In 1050 Macbeth went on pilgrimage to Rome, where, a chronicler wrote, he \"scattered money like seed to the poor.\" Malcolm killed him in 1057. The darker stories about Macbeth were written down centuries later, under kings descended from Malcolm. Compare <a class=\"xref\" href=\"../1984/#q9\" target=\"_blank\" rel=\"noopener\">1984, quote 9<\/a>: \"Who controls the past controls the future.\""
]

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const VIEWS = { plot: PLOT, quotes: Q };
let view = "plot", idx = { plot: 0, quotes: 0 };

function qrefs(list) { return list.map(n => `<button class="ref" data-go="quotes:${n - 1}">${n}</button>`).join(", "); }
function note(h, body, cls = "") { return `<div class="note ${cls}"><h2>${h}</h2>${body.startsWith("<p") || body.startsWith("<dl") ? body : `<p>${body}</p>`}</div>`; }

/* ---------- quotes ---------- */
function renderQuote(d, i) {
  $("loc").textContent = d.loc;
  $("who").textContent = d.who || "";
  let qh = d.img ? `<figure class="plate"><img src="${d.img.src}" alt="${esc(d.img.alt)}"></figure>` : "";
  $("left").innerHTML = qh + d.text;
  let h = note("In plain English", d.plain, "plain");
  h += note("Context", d.ctx);
  if (d.extra) h += note("Did you know?", d.extra);
  h += note("Think about it", d.think);
  if (d.lens) h += note(`Lens: ${d.lens[0]}`, d.lens[1], "lens");
  if (d.see && d.see.length) h += note("See also", `<p>${d.see.length > 1 ? "Quotes" : "Quote"} ${qrefs(d.see)}</p>`);
  $("notes").innerHTML = h;
}

/* ---------- plot ---------- */
function renderPlot(d) {
  $("loc").textContent = "";
  $("who").textContent = "";
  if (d.people) {
    $("left").innerHTML = `<p class="kicker">Characters</p><h2>Who's Who</h2><dl class="ppl">` +
      d.people.map(([n, t]) => `<dt>${n}</dt><dd>${t}</dd>`).join("") + `</dl>`;
    $("notes").innerHTML = note("Key terms", `<dl>${d.terms.map(([n, t]) => `<dt>${n}</dt><dd>${t}</dd>`).join("")}</dl>`);
    return;
  }
  $("left").innerHTML = `<p class="kicker">Plot summary</p><h2>${d.title}</h2>` + d.sc.map(c =>
    `<div class="chap"><span class="cn">Sc. ${c.n}</span><div><p>${c.t}</p>${c.q.length ? `<span class="qs">${c.q.length > 1 ? "Quotes" : "Quote"}: ${qrefs(c.q)}</span>` : ""}</div></div>`).join("");
  $("notes").innerHTML = note("In one line", d.line) + note("Watch for", d.watch) +
    note("How to use this", `Each scene gets a few sentences. The numbers under a scene jump to its quotes, which have the close reading. Line numbers follow the Folger edition.`);
}

/* ---------- shell ---------- */
function stripHTML() {
  if (view === "quotes") {
    let last = null, h = "";
    Q.forEach((d, k) => {
      if (d.act !== last) { if (last !== null) h += `</span>`; h += `<span class="grp"><span class="part">Act ${d.act}</span>`; last = d.act; }
      h += `<button data-go="quotes:${k}" class="${d.img ? "has-img" : ""}" aria-label="Quote ${k + 1}">${k + 1}</button>`;
    });
    return h + `</span>`;
  }
  return `<span class="grp">` + VIEWS[view].map((d, k) => `<button class="wide" data-go="${view}:${k}">${d.tab}</button>`).join("") + `</span>`;
}

function hashFor() {
  const i = idx[view];
  if (view === "quotes") return `#q${i + 1}`;
  return `#plot-${PLOT[i].key}`;
}

function render() {
  const list = VIEWS[view], i = idx[view] = Math.max(0, Math.min(list.length - 1, idx[view]));
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === view));
  if (view === "quotes") renderQuote(list[i], i);
  if (view === "plot") renderPlot(list[i]);
  $("strip").innerHTML = stripHTML();
  document.querySelectorAll(".strip button").forEach((b, k) => b.setAttribute("aria-current", k === i));
  $("prev").disabled = i === 0;
  $("next").disabled = i === list.length - 1;
  $("left").scrollTop = 0; $("notes").scrollTop = 0;
  history.replaceState(null, "", hashFor());
}

function go(v, i) { view = v; idx[v] = i; render(); }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-view]");
  if (!t) return;
  if (t.dataset.go) { const [v, i] = t.dataset.go.split(":"); go(v, +i); }
  else if (t.dataset.view) { view = t.dataset.view; render(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") { idx[view]++; render(); }
  if (e.key === "ArrowLeft") { idx[view]--; render(); }
});
$("prev").onclick = () => { idx[view]--; render(); };
$("next").onclick = () => { idx[view]++; render(); };

(function start() {
  const h = location.hash;
  let m;
  if ((m = h.match(/^#q(\d+)$/))) { view = "quotes"; idx.quotes = +m[1] - 1; }
  else if ((m = h.match(/^#plot-([\w-]+)$/))) { view = "plot"; const k = PLOT.findIndex(d => d.key === m[1]); idx.plot = k < 0 ? 0 : k; }
  render();
})();
</script>
