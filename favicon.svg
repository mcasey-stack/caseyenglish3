<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="English III line bullet">
  <title>English III — the line</title>
  <!-- Line bullet, matching .big-bullet on the line page.
       The III is drawn as polygons, not type, so it renders
       identically without loading a webfont. -->
  <circle cx="32" cy="32" r="32" fill="#1B9E57"/>
  <g fill="#08140C">
    <polygon points="15.25,45 21.75,45 26.75,19 20.25,19"/>
    <polygon points="26.25,45 32.75,45 37.75,19 31.25,19"/>
    <polygon points="37.25,45 43.75,45 48.75,19 42.25,19"/>
  </g>
</svg>
