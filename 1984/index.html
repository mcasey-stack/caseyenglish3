      reading: `"You are the dead." The arrest, then weeks of torture in the Ministry of Love. The price is not his life. It is his mind, and Julia.` },
    { name: "Return", plain: `They go back to where they started, but carrying what they've learned.`,
      prompt: `Where does Winston end up, and what is he carrying?`,
      reading: `Back in ordinary London, at the Chestnut Tree Café. What he carries home is what O'Brien taught him: 2 + 2 = 5.` },
    { name: "Change", plain: `They are not the same person anymore. The world around them changes too.`,
      prompt: `How has Winston changed? Has the world?`,
      reading: `He loves Big Brother. Winston has changed completely. The world has not changed at all.` }
  ] },

{ key: "newspeak", tab: "Newspeak Lab", title: "Newspeak Lab",
  site: "Shawnee Linguistics",
  how: `Use the rules from the novel's appendix to translate each sentence into Newspeak. Type your version and check it. The last one is a trap.`,
  rules: [
    [`un-`, `makes the opposite. Warm is <b>uncold</b>; bad is <b>ungood</b>.`],
    [`plus-`, `means "very." <b>Pluscold</b> = very cold.`],
    [`doubleplus-`, `means "extremely." <b>Doublepluscold</b> = freezing.`],
    [`-wise`, `turns a word into an adverb. Quickly is <b>speedwise</b>.`],
    [`-ed`, `ends every past tense, no exceptions: <b>thinked</b>, <b>stealed</b>.`]
  ],
  items: [
    { en: `It is warm today.`, need: [["uncold"]], ban: ["warm"],
      ok: `Doubleplusgood. "Warm" doesn't exist; it's just the opposite of cold.`, hint: `Find the opposite of a word Newspeak keeps.` },
    { en: `That was a very bad speech.`, need: [["plusungood", "doubleplusungood"]], ban: ["bad", "very"],
      ok: `Correct. Two words of English became one word with two prefixes.`, hint: `"Bad" is gone. Build it from "good," then add the prefix for "very."` },
    { en: `She thought about the past.`, need: [["thinked"]], ban: ["thought"],
      ok: `Correct. No irregular verbs: every past tense ends in -ed.`, hint: `Newspeak has no irregular verbs.` },
    { en: `The trains run quickly.`, need: [["speedwise"]], ban: ["quickly"],
      ok: `Correct. "Quickly" becomes speed plus -wise.`, hint: `Turn "speed" into an adverb.` },
    { en: `The news from the front is excellent.`, need: [["doubleplusgood", "plusgood"]], ban: ["excellent"],
      ok: `Correct. "Excellent," "splendid," and "great" all collapse into one word.`, hint: `Newspeak has one word for every kind of good. Make it stronger with a prefix.` },
    { en: `We hold these truths to be self-evident, that all men are created equal.`, open: true,
      reveal: `The appendix uses this exact passage. It says the Declaration of Independence cannot be translated into Newspeak at all. The closest you could get is to swallow the whole idea in one word: <b>crimethink</b>. "All mans are equal" is correct Newspeak grammar, but it would only mean that all men are the same size or strength.` }
  ],
  think: `To translate that last sentence, you had to understand the idea Newspeak is built to kill. A child raised on Newspeak would never hear "equal" used that way. Could that child still invent the thought on their own? Your answer depends on whether words build thought, or thought builds words.`,
  further: [
    [LING_TE, `Shawnee Linguistics, Thought Experiment No. 07`, `Linguistic relativity: does having fewer words mean seeing less? The weak and strong versions of Sapir-Whorf.`],
    [LING_POS, `Shawnee Linguistics, Poverty of the Stimulus`, `Children build a whole grammar from far less than they hear. If that's true, can any word list fence in a mind?`]
  ] },

{ key: "truth", tab: "Ministry of Truth", title: "Your Shift at the Ministry of Truth",
  site: "Media Lab",
  how: `In Part One, Chapter 4, Winston "rectifies" an old news story about the chocolate ration. Do his job, then compare with what he did.`,
  tasks: [
    { label: `The record`, brief: `A <i>Times</i> story from last December reported a promise from the Ministry of Plenty: <b>no cut in the chocolate ration during 1984.</b> This week the ration was cut from 30 grams to 20.`,
      prompt: `Rewrite the old promise so the Party was right all along.`,
      reveal: `Winston replaced the promise with a warning that the ration would probably have to be cut sometime in April. Now the cut proves the Party saw it coming.` },
    { label: `The announcement`, brief: `The new 20-gram ration goes out on the telescreen today.`,
      prompt: `Write the headline the telescreen will read.`,
      reveal: `In Chapter 5 the telescreen announces that the ration has been <b>raised</b> to twenty grams, and crowds march to thank Big Brother. The cut had been announced only the day before. Winston's neighbor Parsons swallows it whole.` },
    { label: `The free-press version`, brief: `Now imagine a country where nobody burns old newspapers.`,
      prompt: `Without printing a single false fact, how could a headline still leave readers thinking the ration went up?`,
      reveal: `One way: lead with the new number and leave the old one out. "Ration set at 20 grams a week, Ministry confirms." Every word is true. The comparison just never appears.` }
  ],
  think: `Winston has to burn the old page, which leaves a trail. The propaganda model on the Media Lab argues that a free press rarely needs a memory hole, because filters decide what gets printed before anything has to be erased. Which kind of control is easier to catch?`,
  further: [
    [ML_1, `Media Lab, SUB.001: The Filter Detector`, `Six news clippings. Name the pressure shaping each one.`],
    [ML_6, `Media Lab, SUB.006: Headline Surgery`, `One event, three headlines. Feel how a headline is a frame.`]
  ] }
];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = {
  get(k) { try { return localStorage.getItem("r1984:" + k) || ""; } catch (e) { return ""; } },
  set(k, v) { try { localStorage.setItem("r1984:" + k, v); } catch (e) {} }
};
const VIEWS = { plot: PLOT, quotes: Q, acts: ACTS };
let view = "plot", idx = { plot: 0, quotes: 0, acts: 0 }, circleStep = 0;

function qrefs(list) { return list.map(n => `<button class="ref" data-go="quotes:${n - 1}">${n}</button>`).join(", "); }
function note(h, body, cls = "") { return `<div class="note ${cls}"><h2>${h}</h2>${body.startsWith("<") ? body : `<p>${body}</p>`}</div>`; }
function further(list) {
  return note("Go further", list.map(([u, t, d]) => `<a class="go" href="${u}" target="_blank" rel="noopener"><b>${t} &#8599;</b><span>${d}</span></a>`).join(""));
}

/* ---------- quotes ---------- */
function renderQuote(d, i) {
  $("loc").textContent = d.loc;
  $("who").textContent = d.who || "";
  let qh = d.img ? `<figure class="screen"><img src="${d.img.src}" alt="${esc(d.img.alt)}"></figure>` : "";
  qh += d.q.map(p => p.startsWith("<blockquote") ? p : `<p>${p}</p>`).join("");
  $("left").innerHTML = qh;
  let h = note("Context", d.ctx);
  if (d.extra) h += note(i === Q.length - 1 ? "A critic's reading" : "Did you know?", d.extra, "extra");
  h += note("Think about it", d.think);
  if (d.lens) h += note(`Lens: ${d.lens.name}`, d.lens.text, "lens");
  if (d.see && d.see.length) h += note("See also", `<p>${d.see.length > 1 ? "Quotes" : "Quote"} ${qrefs(d.see)}</p>`);
  $("notes").innerHTML = h;
}

/* ---------- plot ---------- */
function renderPlot(d) {
  $("loc").textContent = "";
  $("who").textContent = "";
  if (d.people) {
    $("left").innerHTML = `<p class="kicker">Characters</p><h2>Who's Who</h2><dl class="ppl">` +
      d.people.map(([n, t]) => `<dt>${n}</dt><dd>${t}</dd>`).join("") + `</dl>`;
    $("notes").innerHTML = note("Key terms", `<dl>${d.terms.map(([n, t]) => `<dt>${n}</dt><dd>${t}</dd>`).join("")}</dl>`);
    return;
  }
  $("left").innerHTML = `<p class="kicker">Plot summary</p><h2>${d.title}</h2>` + d.ch.map(c =>
    `<div class="chap"><span class="cn">${c.n ? "Ch. " + c.n : "&sect;"}</span><div><p>${c.t}</p>${c.q ? `<span class="qs">${c.q.length > 1 ? "Quotes" : "Quote"}: ${qrefs(c.q)}</span>` : ""}</div></div>`).join("");
  $("notes").innerHTML = note("In one line", d.line) + note("Watch for", d.watch) +
    note("How to use this", `Each chapter gets a few sentences. The numbers under a chapter jump to its quotes, which have the close reading.`);
}

/* ---------- activities ---------- */
function answersText(a) {
  let out = [`1984 Reading Room: ${a.title}`, ""];
  if (a.steps) a.steps.forEach((s, k) => out.push(`${k + 1}. ${s.name}: ${store.get(`circle:${k}`)}`));
  if (a.items) a.items.forEach((it, k) => out.push(`${it.en}\n   ${store.get(`newspeak:${k}`)}`));
  if (a.tasks) a.tasks.forEach((t, k) => out.push(`${t.label}: ${store.get(`truth:${k}`)}`));
  return out.join("\n");
}
function copyRow(a) { return `<div class="row"><button class="btn" data-copy="${a.key}">Copy my answers</button><span class="copied" id="copied"></span></div>`; }

function circleSVG(a) {
  const cx = 165, cy = 165, r = 120;
  let s = `<svg class="circle" viewBox="0 0 330 330" role="group" aria-label="Story Circle steps">`;
  s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#8a836f" stroke-width="1.5"/>`;
  s += `<line x1="${cx - r - 14}" y1="${cy}" x2="${cx + r + 14}" y2="${cy}" stroke="#aaa38f" stroke-dasharray="3 4"/>`;
  s += `<text class="axis" x="${cx}" y="${cy - 8}" text-anchor="middle">ORDER</text><text class="axis" x="${cx}" y="${cy + 18}" text-anchor="middle">CHAOS</text>`;
  a.steps.forEach((st, k) => {
    const ang = -Math.PI / 2 + k * Math.PI / 4, x = cx + r * Math.cos(ang), y = cy + r * Math.sin(ang);
    const cls = ["node", k === circleStep ? "on" : "", store.get(`circle:${k}`) ? "done" : ""].join(" ");
    s += `<g class="${cls}" data-step="${k}" tabindex="0" role="button" aria-label="Step ${k + 1}: ${st.name}">
      <circle cx="${x}" cy="${y}" r="19"/><text class="num" x="${x}" y="${y + 4.5}" text-anchor="middle">${k + 1}</text></g>`;
    s += `<text class="axis" x="${cx + (r - 48) * Math.cos(ang)}" y="${cy + (r - 48) * Math.sin(ang) + 4}" text-anchor="middle" style="font-size:11px;fill:#22211d">${st.name.toUpperCase()}</text>`;
  });
  return s + `</svg>`;
}

function renderActs(a) {
  $("loc").textContent = a.site ? `Connects to ${a.site}` : "";
  $("who").textContent = "";
  let L = `<p class="kicker">Activity</p><h2>${a.title}</h2>`;
  if (a.steps) {
    const st = a.steps[circleStep], k = circleStep;
    L += circleSVG(a);
    L += `<div class="card"><h3>${k + 1}. ${st.name}</h3><p class="plain">${st.plain}</p>
      <p class="prompt">${st.prompt}</p>
      <textarea data-save="circle:${k}" aria-label="Your answer for ${st.name}">${esc(store.get(`circle:${k}`))}</textarea>
      <div class="row"><button class="btn" data-reveal="r${k}">Show one reading</button>
      ${k < 7 ? `<button class="btn" data-step="${k + 1}">Next step &rarr;</button>` : ""}</div>
      <div class="reveal" id="r${k}" hidden>${st.reading}</div></div>` + copyRow(a);
  }
  if (a.items) {
    L += a.items.map((it, k) => `<div class="card"><p class="kicker">${k + 1}</p><p class="en">${it.en}</p>
      ${it.open
        ? `<textarea data-save="newspeak:${k}" aria-label="Your translation">${esc(store.get(`newspeak:${k}`))}</textarea>
           <div class="row"><button class="btn" data-reveal="n${k}">What the appendix says</button></div>
           <div class="reveal" id="n${k}" hidden>${it.reveal}</div>`
        : `<input type="text" data-save="newspeak:${k}" aria-label="Your Newspeak version" value="${esc(store.get(`newspeak:${k}`))}">
           <div class="row"><button class="btn" data-check="${k}">Check</button><span class="fb" id="f${k}" aria-live="polite"></span></div>`}
      </div>`).join("") + copyRow(a);
  }
  if (a.tasks) {
    L += a.tasks.map((t, k) => `<div class="card"><p class="kicker">Step ${k + 1}: ${t.label}</p><p>${t.brief}</p>
      <p class="prompt"><b>${t.prompt}</b></p>
      <textarea data-save="truth:${k}" aria-label="${esc(t.prompt)}">${esc(store.get(`truth:${k}`))}</textarea>
      <div class="row"><button class="btn" data-reveal="t${k}">${k < 2 ? "What happened in the novel" : "One possibility"}</button></div>
      <div class="reveal" id="t${k}" hidden>${t.reveal}</div></div>`).join("") + copyRow(a);
  }
  $("left").innerHTML = L;
  let N = note("How it works", a.how);
  if (a.rules) N += note("The rules", `<dl>${a.rules.map(([r, t]) => `<dt>${r}</dt><dd>${t}</dd>`).join("")}</dl>`);
  N += note("Think about it", a.think) + further(a.further);
  $("notes").innerHTML = N;
}

function checkNewspeak(k) {
  const it = ACTS.find(a => a.key === "newspeak").items[k];
  const raw = (document.querySelector(`[data-save="newspeak:${k}"]`).value || "").toLowerCase();
  const words = raw.replace(/[^a-z\s]/g, " ").split(/\s+/).filter(Boolean);
  const fb = $("f" + k);
  if (!words.length) { fb.className = "fb no"; fb.textContent = "Type a translation first."; return; }
  const banned = it.ban.find(b => words.includes(b));
  const hit = it.need.every(group => group.some(w => words.includes(w)));
  if (banned) { fb.className = "fb no"; fb.textContent = `"${banned}" is oldspeak. ${it.hint}`; }
  else if (hit) { fb.className = "fb ok"; fb.textContent = it.ok; }
  else { fb.className = "fb no"; fb.textContent = `Not yet. ${it.hint}`; }
}

/* ---------- shell ---------- */
function stripHTML() {
  if (view === "quotes") {
    const label = { "Part One": "Part I", "Part Two": "Part II", "Part Three": "Part III", "Appendix": "App." };
    let last = null, h = "";
    Q.forEach((d, k) => {
      if (d.part !== last) { if (last !== null) h += `</span>`; h += `<span class="grp"><span class="part">${label[d.part]}</span>`; last = d.part; }
      h += `<button data-go="quotes:${k}" class="${d.img ? "has-img" : ""}" aria-label="Quote ${k + 1}">${k + 1}</button>`;
    });
    return h + `</span>`;
  }
  return `<span class="grp">` + VIEWS[view].map((d, k) => `<button class="wide" data-go="${view}:${k}">${d.tab}</button>`).join("") + `</span>`;
}

function hashFor() {
  const i = idx[view];
  if (view === "quotes") return `#q${i + 1}`;
  return `#${view}-${VIEWS[view][i].key}`;
}

function render() {
  const list = VIEWS[view], i = idx[view] = Math.max(0, Math.min(list.length - 1, idx[view]));
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === view));
  if (view === "quotes") renderQuote(list[i], i);
  if (view === "plot") renderPlot(list[i]);
  if (view === "acts") renderActs(list[i]);
  $("count").textContent = "";
  $("strip").innerHTML = stripHTML();
  document.querySelectorAll(".strip button").forEach((b, k) => b.setAttribute("aria-current", k === i));
  $("prev").disabled = i === 0;
  $("next").disabled = i === list.length - 1;
  $("left").scrollTop = 0; $("notes").scrollTop = 0;
  history.replaceState(null, "", hashFor());
}

function go(v, i) { view = v; idx[v] = i; render(); }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-view],[data-step],[data-reveal],[data-check],[data-copy]");
  if (!t) return;
  if (t.dataset.go) { const [v, i] = t.dataset.go.split(":"); go(v, +i); }
  else if (t.dataset.view) { view = t.dataset.view; render(); }
  else if (t.dataset.step !== undefined) { circleStep = +t.dataset.step; render(); }
  else if (t.dataset.reveal) { const r = $(t.dataset.reveal); r.hidden = !r.hidden; }
  else if (t.dataset.check !== undefined) checkNewspeak(+t.dataset.check);
  else if (t.dataset.copy) {
    const a = ACTS.find(x => x.key === t.dataset.copy), txt = answersText(a);
    const done = () => { $("copied").textContent = "Copied. Paste it wherever your teacher asks."; };
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, () => { $("copied").textContent = "Copy failed. Select your answers and copy them by hand."; });
  }
});
document.addEventListener("input", e => { const k = e.target.dataset && e.target.dataset.save; if (k) store.set(k, e.target.value); });
document.addEventListener("keydown", e => {
  if (e.target.matches("textarea, input")) {
    if (e.key === "Enter" && e.target.matches("input[data-save^='newspeak:']")) checkNewspeak(+e.target.dataset.save.split(":")[1]);
    return;
  }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("g.node")) { e.preventDefault(); circleStep = +e.target.dataset.step; render(); return; }
  if (e.key === "ArrowRight") { idx[view]++; render(); }
  if (e.key === "ArrowLeft") { idx[view]--; render(); }
});
$("prev").onclick = () => { idx[view]--; render(); };
$("next").onclick = () => { idx[view]++; render(); };

(function start() {
  const h = location.hash;
  let m;
  if ((m = h.match(/^#q(\d+)$/))) { view = "quotes"; idx.quotes = +m[1] - 1; }
  else if ((m = h.match(/^#(plot|acts)-([\w-]+)$/))) { view = m[1]; const k = VIEWS[view].findIndex(d => d.key === m[2]); idx[view] = k < 0 ? 0 : k; }
  render();
})();
</script>
</body>
</html>
